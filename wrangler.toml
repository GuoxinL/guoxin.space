name = "guoxin-space"
main = "worker.js"
compatibility_date = "2026-08-20"

# Worker 非加密环境变量（随 CI `wrangler deploy --keep-vars` 注入；与 dashboard 已有变量合并）。
# 注意：AUTH_SECRET / GITHUB_CLIENT_SECRET 等敏感项走 Cloudflare Secrets（加密），不在此文件。
# 自定义域 api.guoxin.space 在 Cloudflare Dashboard（Worker Settings → Custom Domains → 「+ 添加域名」）手动添加，不写在此文件。
[vars]
TODO_REPO = "GuoxinL/todo-data"
TODO_PATH = "todo"
TODO_BRANCH = "main"
