name: Deploy to GitHub Pages

# 自动构建 + 发布到 GitHub Pages：push 到 main 即构建并上线，无手动闸门。
# 自定义域名 guoxin.space 通过仓库根 CNAME 注入产物根。
# 流程：push/workflow_dispatch → build（pnpm install + pnpm build + 上传产物）→ deploy（deploy-pages 上线）。
# 前置：仓库 Settings → Pages → Source 须为「GitHub Actions」（build_type=workflow），否则 deploy-pages 报错。
# 回滚：在 Pages Source 切回 branch deploy 可秒级恢复旧站（本流程默认走 Actions 自动发布）。
# 发布根要求含 CNAME + 404.html（SSG 已生成 404.html，CNAME 由本流程补齐）。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建（客户端 + SSG 预渲染）
        run: pnpm build

      - name: 补齐 CNAME（自定义域名 guoxin.space）
        run: cp CNAME app/dist/CNAME

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
