name: 校验 SSG 产物（404.html / CNAME）

# P7 起的产物校验：旧站的「index.html 与 404.html 字节一致」检查已废弃
# （旧站文件在 P8 清理），改为校验 Qwik SSG 产物 app/dist 含 404.html 与 CNAME，
# 避免切流后发布根缺 404.html / 自定义域名 CNAME 导致深层直链 404 或域名失效。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-artifact:
    name: app/dist 含 404.html 与 CNAME
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建（客户端 + SSG 预渲染）
        run: pnpm build

      - name: 补齐 CNAME（与 deploy.yml 一致）
        run: cp CNAME app/dist/CNAME

      - name: 校验 404.html 与 CNAME 存在于产物
        run: |
          test -f app/dist/404.html || { echo "::error::app/dist/404.html 缺失（SSG 未生成）"; exit 1; }
          test -s app/dist/404.html || { echo "::error::app/dist/404.html 为空"; exit 1; }
          test -f app/dist/CNAME || { echo "::error::app/dist/CNAME 缺失（deploy.yml 会补，但此处预检）"; exit 1; }
          echo "OK: 404.html ($(wc -c < app/dist/404.html) 字节) / CNAME ($(cat app/dist/CNAME))"
